      /* ==========================================
   .BLOCK — METALLIC NEON BUTTON / LINK
   ========================================== */

.block {
    position: relative;
    z-index: 1;
    display: block;
    overflow: hidden;
    margin-bottom: 20px;
    padding: 10px 12px;

    border: 1px solid rgba(194, 156, 255, 0.62);
    border-radius: 12px;

    color: #190a2c;
    background: linear-gradient(
        125deg,
        #00d9ff 0%,
        #8cefff 22%,
        #bc78ff 49%,
        #ff00b8 75%,
        #ff5bce 100%
    );
    background-size: 300% 300%;

    box-shadow:
        inset 0 1px 0 rgba(244, 255, 255, 0.56),
        inset 0 -3px 8px rgba(72, 4, 81, 0.24),
        0 0 12px rgba(0, 217, 255, 0.32),
        0 0 22px rgba(255, 0, 184, 0.24),
        0 7px 15px rgba(0, 0, 0, 0.3);

    cursor: pointer;
    font-weight: 900;
    letter-spacing: 2px;
    text-align: center;
    text-decoration: none;
    text-shadow: 0 1px 0 rgba(255, 235, 250, 0.42);

    animation: steam 4.2s ease infinite;
    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        filter 0.25s ease;
}

/* Kilau metallic berjalan */
.block::before {
    content: "";
    position: absolute;
    top: 0;
    left: -110%;
    z-index: 1;
    width: 48%;
    height: 100%;
    transform: skewX(-24deg);

    background: linear-gradient(
        90deg,
        transparent,
        rgba(244, 255, 255, 0.66),
        transparent
    );

    animation: block-shine 2.9s ease-in-out infinite;
    pointer-events: none;
}

/* Garis chrome di bagian dalam */
.block::after {
    content: "";
    position: absolute;
    inset: 3px;
    z-index: 0;

    border: 1px solid rgba(31, 8, 50, 0.22);
    border-radius: 8px;
    pointer-events: none;
}

/* Jika di dalam .block ada span atau icon, tetap berada di atas efek */
.block > * {
    position: relative;
    z-index: 2;
}

.block:hover {
    transform: translateY(-3px) scale(1.015);
    filter: brightness(1.1) saturate(1.15);

    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.65),
        inset 0 -3px 8px rgba(72, 4, 81, 0.2),
        0 0 17px rgba(0, 217, 255, 0.84),
        0 0 31px rgba(255, 0, 184, 0.58),
        0 12px 24px rgba(0, 0, 0, 0.38);
}

.block:active {
    transform: translateY(0) scale(0.985);
}

/* ==========================================
   ANIMASI GRADIENT & KILAU
   ========================================== */

@keyframes steam {
    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

@keyframes block-shine {
    0%,
    45% {
        left: -110%;
    }

    75%,
    100% {
        left: 155%;
    }
}

@media (prefers-reduced-motion: reduce) {
    .block,
    .block::before {
        animation: none;
    }
}
